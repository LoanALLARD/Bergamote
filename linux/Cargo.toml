[package]
name = "bergamote"
version = "1.0.0"
edition = "2021"
description = "Radial file converter: drag files, tap a key, drop them on a slice"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "bergamote_linux"
path = "src/lib.rs"

[[bin]]
name = "bergamote"
path = "src/main.rs"

[dependencies]
bergamote-core = { path = "../core" }
# Conversions, en Rust pur : elles se testent sur n'importe quel système.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
lopdf = "0.42"
pdf-extract = "0.12"
hayro = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# L'interface : GTK 4 pour les fenêtres, X11 pour le geste et le placement du camembert, une
# icône StatusNotifierItem pour la zone de notification.
[target.'cfg(target_os = "linux")'.dependencies]
# v4_6 : GdkFileList, pour lire les fichiers d'un glisser (GTK 4.6, Ubuntu 22.04 et Debian 12).
gtk = { package = "gtk4", version = "0.11", features = ["v4_6"] }
gdk-x11 = { package = "gdk4-x11", version = "0.11" }
x11rb = { version = "0.14", features = ["randr", "shape"] }
ksni = { version = "0.3", features = ["blocking"] }
