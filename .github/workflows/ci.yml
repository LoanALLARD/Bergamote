name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Shared core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml
      - name: Lint
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

  mac:
    name: Mac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Add the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the core
        run: mac/scripts/build-core.sh
      - name: Test
        run: swift test --package-path mac
      - name: Package
        run: mac/scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bergamote-mac
          path: mac/build/Bergamote-*.zip

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test windows/Bergamote.sln -c Release
      - name: Publish
        run: >-
          dotnet publish windows/Bergamote.Windows -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o windows/publish
      - uses: actions/upload-artifact@v4
        with:
          name: Bergamote-windows-x64
          path: windows/publish/Bergamote.exe
