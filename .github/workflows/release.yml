# Pushing a tag such as v1.2.0 builds the three apps and publishes them as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name the packages after the release
        run: |
          mkdir release
          cp artifacts/Bergamote-mac/*.zip "release/Bergamote-${GITHUB_REF_NAME}-mac.zip"
          cp artifacts/Bergamote-windows-x64/Bergamote.exe "release/Bergamote-${GITHUB_REF_NAME}-windows-x64.exe"
          cp artifacts/Bergamote-linux/*.deb artifacts/Bergamote-linux/*.tar.gz release/
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Bergamote ${GITHUB_REF_NAME#v}" --generate-notes
